name: Tech Path Win-back Notifications

on:
  schedule:
    # 08:15 UTC = 09:15 WAT
    - cron: "15 8 * * *"
  workflow_dispatch:

jobs:
  run-win-back:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Tech Path win-back cron
        env:
          CRON_SECRET: ${{ secrets.TECH_PATH_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "TECH_PATH_CRON_SECRET is not configured."
            exit 1
          fi

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --retry-all-errors \
            --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://path.dev-champions.tech/api/cron/win-back"
